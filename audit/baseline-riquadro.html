font:14px ui-monospace,monospace;display:grid;place-items:center;height:100vh}
b{font-size:64px;display:block;text-align:center}</style></head><body>
<div><b id="v">—</b><span>rAF al secondo · pagina vuota, nessun canvas</span></div>
