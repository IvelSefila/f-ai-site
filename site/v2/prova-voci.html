<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova voci di Nous</title>
<style>body{font:16px/1.5 system-ui;background:#0b0f16;color:#e8eef5;max-width:720px;margin:24px auto;padding:0 16px}button{background:#14c08a;color:#04120d;border:0;border-radius:10px;padding:10px 14px;margin:4px;font:600 14px system-ui;cursor:pointer}p{color:#9fb0c2}textarea{width:100%;height:90px;background:#121a26;color:#e8eef5;border:1px solid #2a3a4e;border-radius:10px;padding:10px;font:15px system-ui}</style>
<h1>Prova le voci femminili</h1><p>Clicca una voce: legge il testo qui sotto con Azure (stesso Worker del sito).</p>
<textarea id="t">Ciao, sono Nous, l'assistente di Fabrizio. Ti faccio fare un giro del sito e ti spiego cosa trovi in ogni sezione: dai lavori agli strumenti, fino al modulo per raccontare il tuo progetto.</textarea>
<div id="b"></div><p id="s"></p>
<script>
const V=[['Isabella (italiana)','it-IT-IsabellaNeural'],['Elsa (italiana)','it-IT-ElsaNeural'],['Fiamma (italiana)','it-IT-FiammaNeural'],['Imelda (italiana)','it-IT-ImeldaNeural'],['Palmira (italiana)','it-IT-PalmiraNeural'],['Irma (italiana)','it-IT-IrmaNeural'],['Ava multilingue','en-US-AvaMultilingualNeural'],['Emma multilingue','en-US-EmmaMultilingualNeural'],['Seraphina multilingue','de-DE-SeraphinaMultilingualNeural'],['Vivienne multilingue','fr-FR-VivienneMultilingualNeural']];
const b=document.getElementById('b'),s=document.getElementById('s');let a;
for(const [n,v] of V){const x=document.createElement('button');x.textContent=n;x.onclick=async()=>{s.textContent='Carico '+n+'…';if(a)a.pause();try{const r=await fetch('https://nodo-proxy.fabrizio-mana.workers.dev/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('t').value.slice(0,450),voice:v,rate:'-2%'})});if(!r.ok)throw new Error(r.status);a=new Audio(URL.createObjectURL(await r.blob()));await a.play();s.textContent='In ascolto: '+n}catch(e){s.textContent='Errore '+e.message}};b.appendChild(x)}
</script></html>
